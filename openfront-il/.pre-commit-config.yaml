repos:
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.6]
        args: [--strict]
        files: ^src/

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: \.ts$
        exclude: ^engine/openfront-ai/

      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        files: \.ts$
        exclude: ^engine/openfront-ai/
